name: Inspect Binary Offsets
on: [push, workflow_dispatch]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Injection URL & Offsets
        run: |
          wget -q https://github.com/reisxd/TizenTubeCobalt/releases/download/v2.0.2/cobalt-arm.apk
          unzip -q cobalt-arm.apk -d apk_out
          python3 inspect_so.py
